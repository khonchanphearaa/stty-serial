name: tty_serial
description: Serial ports (/dev/tty*) on rooted Android kiosk boards without the NDK, plus a library for the TCN vending driver board. Works on Android 4.4 (API 19).
version: 0.1.0
topics:
  - serial
  - android
  - kiosk
  - vending
  - hardware

environment:
  sdk: '>=3.1.5 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.eroxii.tty_serial
        pluginClass: TtySerialPlugin
